<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Solid gradient background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle top shine -->
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Thin border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="white" stroke-width="2" opacity="0.1"/>

  <!-- YH monogram - clean bold strokes -->
  <g fill="none" stroke="white" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- Y -->
    <path d="M 72 120 L 180 265"/>
    <path d="M 260 120 L 180 240"/>
    <path d="M 180 265 L 180 395"/>

    <!-- H -->
    <path d="M 285 120 L 285 395"/>
    <path d="M 285 257 L 425 257"/>
    <path d="M 425 120 L 425 395"/>
  </g>
</svg>
